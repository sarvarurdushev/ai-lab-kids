databases:
  - name: ai-lab-kids-db
    databaseName: ai_lab_kids
    plan: basic-256mb
    postgresMajorVersion: "16"

services:
  - type: web
    name: ai-lab-kids
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm ci && npm run build
    preDeployCommand: npm run db:migrate
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ai-lab-kids-db
          property: connectionString
      - key: DIRECT_DATABASE_URL
        fromDatabase:
          name: ai-lab-kids-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: sarvarurdushev@gmail.com
    # Uploaded lesson images/audio (public/uploads) live on local disk — without
    # a persistent disk they're wiped on every redeploy/restart. Uncomment once
    # on a plan that supports disks (single instance only; disks don't work
    # alongside autoscaling). See docs/DEPLOYMENT.md for the tradeoffs.
    # disk:
    #   name: uploads
    #   mountPath: /opt/render/project/src/public/uploads
    #   sizeGB: 1
